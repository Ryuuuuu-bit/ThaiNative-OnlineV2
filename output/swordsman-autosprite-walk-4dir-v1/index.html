<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>นักดาบ · ท่าเดิน 4 ทิศ</title>
<style>@font-face{font-family:Thai;src:url('./thai.woff2')}*{box-sizing:border-box}body{margin:0;background:#0b1518;color:#dbe9e1;font-family:Thai,system-ui,sans-serif}main{max-width:1240px;margin:auto;padding:24px}h1{font-size:24px;margin:6px 0}small{color:#d7b879}p{color:#a9c0b5;line-height:1.7;margin:4px 0}.controls{display:flex;gap:16px;flex-wrap:wrap;align-items:center;padding:14px 16px;background:#142524;border:1px solid #8ebda02c;border-radius:12px;margin:16px 0}button,select{font:inherit;background:#24463d;color:#e0eee7;border:1px solid #bba16b66;border-radius:7px;padding:7px 13px;cursor:pointer}label{display:flex;align-items:center;gap:8px}input{accent-color:#77d6b4}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{border:1px solid #96bca52b;border-radius:14px;overflow:hidden;background:#102020}.card h2{margin:0;padding:11px 14px;font-size:16px;border-bottom:1px solid #96bca52b;display:flex;justify-content:space-between;align-items:center}.badge{font-size:11px;padding:3px 9px;border-radius:12px}.ok{background:#2f6b4f;color:#d8f5e6}.pending{background:#6b5a2f;color:#f5ead8}.fail{background:#6b2f2f;color:#f5d8d8}.stage{background:radial-gradient(ellipse at 50% 100%,#30463a,#122627 75%)}.stage.light{background:#deded0}canvas{display:block;width:100%}.big{height:300px}.row{display:flex;align-items:center;justify-content:space-around;padding:8px;background:#172a25;font-size:12px;color:#acc7b8}.small{width:90px;height:80px}.note{padding:10px 14px;font-size:12.5px;line-height:1.75;color:#bdcec4;border-top:1px solid #96bca52b}.foot{display:flex;justify-content:space-between;padding:6px 14px;font-size:12px;color:#92b5a4}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){main{padding:14px}.grid{grid-template-columns:1fr}}</style>
<main><small>THAINATIVE ONLINE · MOTION LAB · LOCAL PREVIEW</small><h1>นักดาบ — ท่าเดิน AutoSprite ครบ 4 ทิศ</h1><p>ทุกทิศล็อกเฟรมแรกด้วยภาพ idle ต้นฉบับของทิศนั้น · สเกลเดียวทั้งชุดต่อทิศ (สูงกลางชุด 168 px) · ไม่มี retime / duplicate / mirror</p>
<div class="controls"><button id="pause">หยุดภาพ</button><button id="step">ทีละเฟรม →</button><label>ความเร็ว<select id="speed"><option value=".25">¼×</option><option value=".5">½×</option><option value="1" selected>1×</option></select></label><label>ขยาย<select id="zoom"><option value=".8">0.8×</option><option value="1.2" selected>1.2×</option><option value="1.6">1.6×</option></select></label><label>พื้นหลัง<select id="bg"><option value="dark">หมึก</option><option value="light">สว่าง</option></select></label><label><input id="idle" type="checkbox">แสดง idle ต้นฉบับซ้อน</label><span id="frame"></span></div>
<div class="grid" id="grid"></div></main>
<script type="module">
const $=s=>document.querySelector(s),DIRS=['SE','SW','NE','NW'];
const img=src=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>no(Error(src));i.src=src});
const data=await Promise.all(DIRS.map(async d=>{const meta=await fetch(`./${d}/metadata.json`).then(r=>r.json());const [walk,idle]=await Promise.all([img(`./${d}/walk-normalized.png`),img(`./${d}/original-idle-${d}.png`)]);return{d,meta,walk,idle}}));
for(const x of data){const q=x.meta.quality,st=q.shipReady?['ok','ผ่าน']:(String(q.shipReadyNote||'').startsWith('Pending')?['pending','รอตรวจ']:['fail','ไม่ผ่าน']);
 const el=document.createElement('section');el.className='card';el.innerHTML=`<h2>${x.d}<span class="badge ${st[0]}">${st[1]}</span></h2><div class="stage"><canvas class="big"></canvas></div><div class="foot"><span>${x.meta.frames} เฟรม · ${x.meta.duration} วินาที</span><span class="fr"></span></div><div class="row"><canvas class="small"></canvas><span>ขนาดในเกม<br>≈50 px</span></div><div class="note">${x.meta.review}</div>`;$('#grid').append(el);x.el=el}
let phase=0,playing=true,last=performance.now();
function draw(cv,x,scale,small){const dpr=devicePixelRatio||1,b=cv.getBoundingClientRect();cv.width=b.width*dpr;cv.height=b.height*dpr;const c=cv.getContext('2d');c.scale(dpr,dpr);const s=small?.3:Number($('#zoom').value)*(b.height/300)*1.05;c.translate(b.width/2,b.height-14);c.scale(s,s);const n=x.meta.frames,f=Math.min(n-1,Math.floor(phase*n)),col=x.meta.columns;
 if(!small){c.strokeStyle=$('#bg').value==='light'?'#435e5877':'#b3cfac55';c.lineWidth=1/s;c.setLineDash([5/s,5/s]);for(const y of [0,-168]){c.beginPath();c.moveTo(-200,y);c.lineTo(200,y);c.stroke()}c.setLineDash([])}
 if(!small&&$('#idle').checked){c.globalAlpha=.35;c.drawImage(x.idle,-192,-240);c.globalAlpha=1}
 c.drawImage(x.walk,(f%col)*384,Math.floor(f/col)*256,384,256,-192,-240,384,256);return f}
function render(){for(const x of data){const f=draw(x.el.querySelector('.big'),x);draw(x.el.querySelector('.small'),x,0,true);x.el.querySelector('.fr').textContent=`${f+1} / ${x.meta.frames}`}$('#frame').textContent=`เฟรม ${Math.floor(phase*25)+1} / 25`}
function tick(now){const dt=Math.min(.08,(now-last)/1000);last=now;if(playing)phase=(phase+dt*Number($('#speed').value)/2)%1;render();requestAnimationFrame(tick)}requestAnimationFrame(tick);
$('#pause').onclick=()=>{playing=!playing;$('#pause').textContent=playing?'หยุดภาพ':'เล่นต่อ'};$('#step').onclick=()=>{playing=false;$('#pause').textContent='เล่นต่อ';phase=((Math.floor(phase*25)+1)%25)/25+.001};$('#bg').onchange=()=>document.querySelectorAll('.stage').forEach(e=>e.classList.toggle('light',$('#bg').value==='light'));
</script></html>

<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>นักดาบ · ท่าเดิน 8 ทิศ</title>
<style>@font-face{font-family:Thai;src:url('./thai.woff2')}*{box-sizing:border-box}body{margin:0;background:#0b1518;color:#dbe9e1;font-family:Thai,system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:22px}h1{font-size:23px;margin:6px 0}small{color:#d7b879}p{color:#a9c0b5;line-height:1.7;margin:4px 0}.controls{display:flex;gap:14px;flex-wrap:wrap;align-items:center;padding:12px 16px;background:#142524;border:1px solid #8ebda02c;border-radius:12px;margin:14px 0}button,select{font:inherit;background:#24463d;color:#e0eee7;border:1px solid #bba16b66;border-radius:7px;padding:7px 13px;cursor:pointer}label{display:flex;align-items:center;gap:8px}input{accent-color:#77d6b4}.compass{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.cell{border:1px solid #96bca52b;border-radius:14px;overflow:hidden;background:radial-gradient(ellipse at 50% 100%,#30463a,#122627 75%)}.cell.light{background:#deded0}.cell h2{margin:0;padding:8px 12px;font-size:14px;display:flex;justify-content:space-between;border-bottom:1px solid #96bca52b;background:#102020cc}.tag{font-size:11px;color:#d7b879}canvas{display:block;width:100%;height:220px}.center{display:flex;flex-direction:column;justify-content:center;gap:10px;padding:16px;background:#102020;font-size:13px;line-height:1.7;color:#bdcec4}.center b{color:#e4d2a0}.game{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end;justify-content:center;padding:14px;background:#172a25;border-radius:12px;margin-top:14px}.game figure{margin:0;text-align:center;font-size:11px;color:#acc7b8}.game canvas{width:64px;height:64px}@media(max-width:640px){main{padding:14px}canvas{height:150px}}</style>
<main><small>THAINATIVE ONLINE · MOTION LAB · LOCAL PREVIEW</small><h1>นักดาบ — ท่าเดินครบ 8 ทิศ (ไฟล์เดียวกับที่ขึ้นเกม)</h1><p>อ่านจาก <code>meadow-3d/art/texture-sources/hero-painted/hero-walk-v1.png</code> · 8 แถว × 8 เฟรม + ท่ายืน · เซลล์ 384×256 เท้าอยู่ที่ (192,240) · 0.8 วินาทีต่อรอบเหมือนในเกม</p>
<div class="controls"><button id="pause">หยุดภาพ</button><button id="step">ทีละเฟรม →</button><label>ความเร็ว<select id="speed"><option value=".25">¼×</option><option value=".5">½×</option><option value="1" selected>1×</option></select></label><label>พื้นหลัง<select id="bg"><option value="dark">หมึก</option><option value="light">สว่าง</option></select></label><label><input id="stand" type="checkbox">ท่ายืน (คอลัมน์ 9)</label><span id="frame"></span></div>
<div class="compass" id="compass"></div>
<div class="game" id="game"></div></main>
<script type="module">
const $=s=>document.querySelector(s);
const ROWS=['SE','SW','NE','NW','S','E','N','W'];
const LAYOUT=['NW','N','NE','W',null,'E','SW','S','SE'];
const NAME={N:'เหนือ (W)',S:'ใต้ (S)',E:'ตะวันออก (D)',W:'ตะวันตก (A)',NE:'ตะวันออกเฉียงเหนือ',NW:'ตะวันตกเฉียงเหนือ',SE:'ตะวันออกเฉียงใต้',SW:'ตะวันตกเฉียงใต้'};
const SOURCE={SE:'AutoSprite · idle เกม',SW:'AutoSprite · idle เกม · ยกขาข้างเดียว',NE:'AutoSprite · idle เกม',NW:'AutoSprite · idle เกม',S:'AutoSprite · ท่ายืนใหม่',E:'AutoSprite · ท่ายืนใหม่',N:'AutoSprite · ท่ายืนใหม่',W:'AutoSprite · ท่ายืนใหม่'};
const atlas=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src='../../meadow-3d/art/texture-sources/hero-painted/hero-walk-v1.png'});
const cw=atlas.width/9,ch=atlas.height/8,views=[];
for(const d of LAYOUT){const el=document.createElement('section');if(!d){el.className='cell center';el.innerHTML='<div><b>เดินด้วย W / A / S / D</b><br>ขึ้น = N · ซ้าย = W · ลง = S · ขวา = E<br>กดสองปุ่มพร้อมกัน = ทิศเฉียง</div><div>ทิศเฉียงเริ่มจากภาพ idle ต้นฉบับของเกม ทิศตรงเริ่มจากท่ายืนที่ผู้ใช้อนุมัติ</div><div>ตอนยืนหันทิศตรง เกมใช้คอลัมน์ท่ายืนใน atlas ท่าเดิน · S และ N ใช้รอบเดินต่อเนื่องที่อยู่กลางคลิป</div>';$('#compass').append(el);continue}
 el.className='cell';el.innerHTML=`<h2>${d}<span class="tag">${NAME[d]}</span></h2><canvas></canvas><h2 style="border:0;border-top:1px solid #96bca52b"><span class="tag">${SOURCE[d]}</span><span class="fr"></span></h2>`;$('#compass').append(el);views.push({d,canvas:el.querySelector('canvas'),fr:el.querySelector('.fr'),el});}
for(const d of ['NW','N','NE','E','SE','S','SW','W']){const f=document.createElement('figure');f.innerHTML=`<canvas></canvas><figcaption>${d}</figcaption>`;$('#game').append(f);views.push({d,canvas:f.querySelector('canvas'),small:true})}
const cap=document.createElement('figure');cap.innerHTML='<figcaption>ขนาดในเกมจริง (สูงราว 50 px)</figcaption>';$('#game').append(cap);
let phase=0,playing=true,last=performance.now();
function draw(v){const dpr=devicePixelRatio||1,b=v.canvas.getBoundingClientRect();v.canvas.width=b.width*dpr;v.canvas.height=b.height*dpr;const c=v.canvas.getContext('2d');c.scale(dpr,dpr);const f=$('#stand').checked?8:Math.floor(phase*8)%8,row=ROWS.indexOf(v.d);
 const s=v.small?50/168:Math.min(b.height/220,1)*1.05;c.translate(b.width/2,b.height-(v.small?6:14));c.scale(s,s);
 if(!v.small){c.strokeStyle=$('#bg').value==='light'?'#435e5877':'#b3cfac44';c.lineWidth=1/s;c.setLineDash([5/s,5/s]);c.beginPath();c.moveTo(-190,0);c.lineTo(190,0);c.moveTo(-190,-168);c.lineTo(190,-168);c.stroke();c.setLineDash([])}
 c.imageSmoothingQuality='high';c.drawImage(atlas,f*cw,row*ch,cw,ch,-192,-240,384,256);if(v.fr)v.fr.textContent=f===8?'ท่ายืน':`${f+1}/8`}
function tick(now){const dt=Math.min(.08,(now-last)/1000);last=now;if(playing)phase=(phase+dt*Number($('#speed').value)/.8)%1;views.forEach(draw);$('#frame').textContent=`เฟรม ${Math.floor(phase*8)%8+1} / 8`;requestAnimationFrame(tick)}requestAnimationFrame(tick);
$('#pause').onclick=()=>{playing=!playing;$('#pause').textContent=playing?'หยุดภาพ':'เล่นต่อ'};$('#step').onclick=()=>{playing=false;$('#pause').textContent='เล่นต่อ';phase=((Math.floor(phase*8)+1)%8)/8+.001};$('#bg').onchange=()=>document.querySelectorAll('.cell:not(.center)').forEach(e=>e.classList.toggle('light',$('#bg').value==='light'));
</script></html>

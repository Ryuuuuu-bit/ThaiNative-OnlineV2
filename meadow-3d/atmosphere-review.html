<!doctype html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Beginning Online · น้ำ แสงเงา และสายลม</title><style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#143426;color:#e7efdd;font:13px Tahoma,sans-serif}#world{position:fixed;inset:0}#world canvas{position:absolute;inset:0}header{position:fixed;top:19px;left:22px;z-index:3;padding:12px 16px;border:1px solid #b9cd9650;border-radius:11px;background:#102922d9;backdrop-filter:blur(10px);pointer-events:none}header small{display:block;letter-spacing:2px;color:#d3c28d;font-size:9px;margin-bottom:5px}h1{margin:0;font-size:18px;font-weight:500}header p{font-size:10px;color:#a7bca8;margin:6px 0 0}aside{position:fixed;left:22px;bottom:22px;width:254px;padding:17px;background:linear-gradient(140deg,#163a2fe8,#102722ed);border:1px solid #95b38466;border-radius:13px;z-index:3;backdrop-filter:blur(10px)}aside h2{font-size:13px;font-weight:500;color:#e4d4a2;margin:0 0 13px}label{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:11px 0;font-size:11px;color:#b6cbb6}input[type=range]{width:112px;accent-color:#a9d4ad}output{font-size:10px;color:#dce6be;min-width:31px;text-align:right;font-variant-numeric:tabular-nums}.slider{display:flex;align-items:center;gap:7px}select,button{font:inherit;color:#ddebd9;background:#173b2d;border:1px solid #9dbb8755;border-radius:6px;padding:7px 10px;cursor:pointer}select{max-width:145px;font-size:11px}button:hover{border-color:#cad4a3}button[aria-pressed=true]{background:#4a6540;border-color:#bcce92;color:#f2eed2}.compare{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:13px 0}.compare button{font-size:11px}.checks{display:flex;gap:12px;border-top:1px solid #7e9d7a44;padding-top:5px;margin-top:13px}.checks label{font-size:10px;gap:5px;margin:8px 0}input[type=checkbox]{accent-color:#9ecb99}#status{display:block;color:#a6c49c;font-size:10px;line-height:1.6;margin-top:9px}.stats{position:fixed;right:22px;top:22px;background:#102922de;border:1px solid #95b38455;border-radius:8px;padding:10px 14px;color:#bdd6b6;font-size:11px;z-index:3}.stats b{color:#e4deaf;font-weight:500}details{position:fixed;right:22px;bottom:22px;font-size:10px;z-index:3;color:#bdd6b6;background:#102922de;border-radius:7px;padding:9px;max-width:300px}pre{white-space:pre-wrap;font-size:10px;max-height:240px;overflow:auto}.hint{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);color:#e5e9bc;background:#102922a0;border-radius:6px;padding:8px 13px;font-size:10px;pointer-events:none}.status-error{color:#ffc1a5!important}@media(max-width:650px){header{top:10px;left:10px;padding:9px 12px}h1{font-size:14px}header p{max-width:190px;font-size:9px}aside{left:10px;bottom:12px;width:225px;padding:12px}.stats{right:10px;top:10px;font-size:9px;padding:8px}.hint{display:none}details{right:10px;bottom:12px;max-width:130px}input[type=range]{width:90px}}
</style></head><body><div id="world"></div><header><small>THE BEGINNING ONLINE · LIVING WORLD</small><h1>ผืนน้ำ แสงแดด และสายลม</h1><p>ปรับบรรยากาศจากภาพอ้างอิง · พรีวิวในเครื่อง</p></header><div class="stats"><b id="fps">— FPS</b><span id="quality-note"> · ภาพสูง</span></div>
<aside><h2>บรรยากาศในเกม</h2><label>สถานที่<select id="scene"><option value="meadow">ริมบึงทุ่งวุ้นจิ๋ว</option><option value="city_plaza">สวนและน้ำพุเมือง</option><option value="forest">ทะเลสาบป่าหมอก</option><option value="ruins">บึงซากนครโบราณ</option><option value="canyon">โอเอซิสหุบเขา</option></select></label><div class="compare"><button id="before" aria-pressed="false">ภาพเดิม</button><button id="after" aria-pressed="true">บรรยากาศใหม่</button></div><label for="hour">เวลา<div class="slider"><input id="hour" type="range" min="7" max="18" step=".25" value="10"><output id="hour-value">10:00</output></div></label><label for="sun">แสงแดด<div class="slider"><input id="sun" type="range" min="0" max="1" step=".05" value=".72"><output id="sun-value">72%</output></div></label><label for="wind">แรงลม<div class="slider"><input id="wind" type="range" min="0" max="1" step=".05" value=".4"><output id="wind-value">เบา</output></div></label><div class="checks"><label><input id="water" type="checkbox" checked>น้ำไหว</label><label><input id="leaves" type="checkbox" checked>ใบไม้ปลิว</label></div><div class="checks"><label><input id="low" type="checkbox">ภาพต่ำ</label><label><input id="pause" type="checkbox">หยุดเวลา</label></div><label style="justify-content:flex-start;font-size:10px"><input id="motion" type="checkbox">แสดงการเคลื่อนไหวในพรีวิว</label><span id="status" role="status">กำลังเตรียมฉาก…</span></aside><div class="hint">ลากภาพเพื่อสำรวจ · ล้อเมาส์เพื่อซูม · สลับภาพเดิมเพื่อเทียบผล</div><details><summary>ข้อมูลพรีวิว</summary><pre id="scene-data">กำลังโหลด…</pre></details><script type="module" src="/src/atmosphere-review.ts"></script></body></html>
